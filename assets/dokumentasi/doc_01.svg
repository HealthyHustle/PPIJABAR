<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" fill="none">
  <!-- Dark Editorial Canvas -->
  <rect width="600" height="400" fill="#121212"/>
  <defs>
    <pattern id="docgrid-1" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#202020" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="600" height="400" fill="url(#docgrid-1)"/>

  <!-- Border & Frame -->
  <rect x="20" y="20" width="560" height="360" fill="none" stroke="#333333" stroke-width="1"/>
  <line x1="20" y1="60" x2="580" y2="60" stroke="#333333" stroke-width="1"/>
  <line x1="20" y1="340" x2="580" y2="340" stroke="#333333" stroke-width="1"/>

  <!-- Metadata Top -->
  <text x="35" y="46" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#D7FF35" letter-spacing="2">// RECORD: REC_2026_01</text>
  <rect x="420" y="32" width="145" height="20" fill="#1C1C1C" stroke="#9747FF" stroke-width="1"/>
  <text x="492" y="46" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#9747FF" letter-spacing="1">AUDIENCE & DISCUSSION</text>

  <!-- Center Graphic: Abstract Conference / Civic Architecture Graphic -->
  <g transform="translate(180, 100)">
    <polygon points="120,20 230,85 120,150 10,85" fill="#181818" stroke="#444444" stroke-width="1.5"/>
    <polygon points="120,20 120,150 10,85" fill="#1F1F1F" stroke="#9747FF" stroke-width="1"/>
    
    <polygon points="120,150 230,85 230,120 120,185 10,120 10,85" fill="#151515" stroke="#333333" stroke-width="1"/>
    
    <!-- Coordinate ticks -->
    <line x1="0" y1="85" x2="240" y2="85" stroke="#9747FF" stroke-width="1" stroke-dasharray="4 4"/>
    <circle cx="120" cy="85" r="5" fill="#D7FF35"/>
  </g>

  <!-- Technical Notice Banner -->
  <rect x="110" y="260" width="380" height="46" fill="#101010" stroke="#D7FF35" stroke-width="1.5"/>
  <rect x="114" y="264" width="6" height="38" fill="#9747FF"/>
  <text x="135" y="287" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#F7F7F7" letter-spacing="2">FIELD_RECORD_PENDING</text>
  <text x="135" y="299" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="500" fill="#888888">// ARCHIVE PLACEHOLDER / DRAFT RECORD</text>

  <!-- Bottom Metadata -->
  <text x="35" y="362" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#999999" letter-spacing="1">EVENT: AUDIENSI KEPEMUDAAN DAERAH</text>
  <text x="565" y="362" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#D7FF35">LOC: WEST_JAVA_DISTRICT</text>
